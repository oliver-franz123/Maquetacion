<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Maquetación de card de comercio electrónico con Tailwind CSS y Vite" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Tienda · Card de producto</title>
  </head>
  <body>
    <!-- Encabezado -->
    <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
      <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3 sm:gap-6">
        <a href="#" class="flex items-center gap-2">
          <span class="grid size-9 place-items-center rounded-xl bg-brand-600 text-sm font-extrabold text-white">TS</span>
          <span class="hidden text-lg font-extrabold tracking-tight text-slate-900 dark:text-white sm:block">TiendaShop</span>
        </a>

        <label class="relative hidden flex-1 sm:block">
          <span class="sr-only">Buscar productos</span>
          <input type="search" placeholder="Buscar productos…"
            class="w-full rounded-full border border-slate-200 bg-slate-100 py-2 pr-4 pl-10 text-sm outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-500/20 dark:border-slate-800 dark:bg-slate-900 dark:focus:bg-slate-900" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            class="pointer-events-none absolute top-1/2 left-3.5 size-4 -translate-y-1/2 text-slate-400">
            <circle cx="11" cy="11" r="7" /><path stroke-linecap="round" d="m20 20-3.5-3.5" />
          </svg>
        </label>

        <button type="button" id="tema" aria-label="Cambiar tema"
          class="grid size-10 place-items-center rounded-full border border-slate-200 text-slate-600 transition hover:bg-slate-100 dark:border-slate-800 dark:text-slate-300 dark:hover:bg-slate-800">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5 dark:hidden">
            <circle cx="12" cy="12" r="4.5" />
            <path stroke-linecap="round" d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
          </svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="hidden size-5 dark:block">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
        </button>

        <button type="button" id="carrito" aria-label="Ver carrito"
          class="relative grid size-10 place-items-center rounded-full bg-slate-900 text-white transition hover:bg-brand-600 dark:bg-white dark:text-slate-900 dark:hover:bg-brand-500 dark:hover:text-white">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h2l2.2 10.4a1.5 1.5 0 0 0 1.5 1.2h7.7a1.5 1.5 0 0 0 1.5-1.2L20 8H6" />
            <circle cx="10" cy="20" r="1.2" /><circle cx="17" cy="20" r="1.2" />
          </svg>
          <span id="carrito-cantidad"
            class="absolute -top-1 -right-1 grid min-w-5 place-items-center rounded-full bg-rose-600 px-1 text-[11px] font-bold text-white">0</span>
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8">
      <section class="mb-6">
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white sm:text-3xl">
          Productos destacados
        </h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
          Maquetación de card de comercio electrónico · Tailwind CSS + Vite
        </p>
      </section>

      <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div id="filtros" class="no-scrollbar -mx-1 flex gap-2 overflow-x-auto px-1 pb-1"></div>

        <select id="orden"
          class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 outline-none transition focus:border-brand-500 sm:w-auto dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200">
          <option value="destacados">Más destacados</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
          <option value="rating">Mejor calificados</option>
        </select>
      </div>

      <section id="grid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></section>

      <p id="vacio" class="hidden py-16 text-center text-sm text-slate-500">
        No hay productos que coincidan con el filtro.
      </p>
    </main>

    <footer class="border-t border-slate-200 py-8 text-center text-xs text-slate-400 dark:border-slate-800">
      Maquetación de ejemplo · Tailwind CSS + Vite
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
